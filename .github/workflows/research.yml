name: research (manual, read-only)

# Research jobs only. No wallet, no private keys, no orders exist anywhere in this repo.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "probe = data-source check | probe_logs = free on-chain trade stream check"
        required: true
        default: "probe"
        type: choice
        options: [probe, probe_logs, probe_jup, watch, watch_list]
      url:
        description: "watch: YouTube video URL"
        required: false
      focus:
        description: "watch: what to focus on (optional)"
        required: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r code/requirements.txt
      - name: Restore earlier outputs (so finished videos are skipped)
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" research-out >/dev/null 2>&1; then
            git clone -q --depth 1 --branch research-out "$url" prev && mkdir -p code/research/out && cp -r prev/* code/research/out/ && rm -rf prev
          fi
      - name: Run
        working-directory: code
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          case "${{ github.event.inputs.action }}" in
            probe) python -m research.probe ;;
            probe_logs) python -m research.probe_logs ;;
            probe_jup) python -m research.probe_jup ;;
            watch_list)
              for u in $(grep -v '^#' tools/watch_list.txt); do
                id=$(echo "$u" | sed -E 's/.*v=([A-Za-z0-9_-]{11}).*/\1/')
                [ -f "research/out/watch/$id.md" ] && { echo "done: $id"; continue; }
                python tools/watch.py "$u" "${{ github.event.inputs.focus }}" research/out/watch || echo "failed: $id (will retry next run)"
                rm -f research/out/watch/ERROR.md; sleep 75
              done ;;
            watch) python tools/watch.py "${{ github.event.inputs.url }}" "${{ github.event.inputs.focus }}" research/out/watch ;;
          esac
      - name: Save outputs to the research branch
        if: always()
        run: |
          [ -d code/research/out ] || exit 0
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" research-out >/dev/null 2>&1; then
            git clone -q --depth 1 --branch research-out "$url" res
          else
            mkdir res && cd res && git init -q && git checkout -q -b research-out && git remote add origin "$url" && cd ..
          fi
          cp -r code/research/out/* res/ && cd res
          git config user.name "memebot"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "${{ github.event.inputs.action }} $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -q origin research-out
